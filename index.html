<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>동물 분류 CBT</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}
header{background:#18243a;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}header b{font-size:20px}
main{max-width:800px;margin:auto;padding:18px 14px 50px}.card{background:white;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 2px 12px #17203312}
h1{font-size:28px;margin:0 0 8px}h2{font-size:22px;margin:15px 0 12px}
label{font-size:13px;font-weight:700;color:#596579;display:block;margin:12px 0 6px}
select,input,button{width:100%;min-height:48px;border:1px solid #d9deea;border-radius:12px;padding:0 12px;font-size:15px;font-family:inherit}
button{background:#244a8f;color:white;border:0;font-weight:700;cursor:pointer;margin-top:12px}
button.secondary{background:#edf1f8;color:#24324a}button.danger{background:#fff0f0;color:#bd3030}button:disabled{background:#ccc;cursor:not-allowed;opacity:0.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.stats{display:flex;gap:8px}.stat{flex:1;background:#f0f4fa;padding:12px;border-radius:12px;text-align:center}.stat b{font-size:20px;display:block}
.option{border:2px solid #dce2ed;padding:15px;border-radius:12px;margin:10px 0;cursor:pointer}.option.selected{border-color:#315eb0;background:#f2f6ff}
.progress{height:6px;background:#e7ebf2;border-radius:9px;overflow:hidden;margin:12px 0}.bar{height:100%;background:#315eb0;transition:width 0.3s}
.meta{color:#68758a;font-size:13px}.badge{display:inline-block;background:#315eb0;color:white;padding:3px 8px;border-radius:4px;font-size:12px;margin-left:5px}
.question-set{border:1px solid #dce2ed;padding:18px;border-radius:12px;margin-bottom:15px}
.question-set .q-title{font-weight:700;font-size:15px;margin-bottom:10px;color:#172033}
.question-set .q-label{font-size:13px;color:#596579;margin-bottom:8px;display:block}
.answer{padding:12px;border-radius:12px;margin-top:12px;font-size:14px}.answer.correct{background:#f0f8f5;color:#18794e;border-left:4px solid #18794e}.answer.wrong{background:#fff5f5;color:#bd3030;border-left:4px solid #bd3030}
.hidden{display:none}
.result-item{padding:15px;border:1px solid #dce2ed;border-radius:12px;margin-bottom:12px}.result-item.correct{background:#f0f8f5;border-color:#18794e}.result-item.wrong{background:#fff5f5;border-color:#bd3030}
.result-item-title{font-weight:700;margin-bottom:8px}.result-item-detail{font-size:13px;line-height:1.6}
@media(max-width:600px){.grid{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}.card{padding:15px}}
</style>
</head>
<body>
<header><b>🐾 동물 분류 CBT</b></header>
<main>

<!-- 홈 화면 -->
<section id="home">
  <div class="card">
    <h1>동물 분류 CBT</h1>
    <div class="meta">한 동물의 문·강·목·과를 한 번에 풀어보세요</div>
  </div>
  
  <div class="card">
    <h2>📝 풀이 시작</h2>
    <div class="grid3">
      <button onclick="startQuiz(10)">10개</button>
      <button onclick="startQuiz(30)">30개</button>
      <button onclick="startQuiz(50)">50개</button>
    </div>
    <button onclick="randomQuiz()" style="background:#764ba2">🎲 랜덤 풀이</button>
  </div>

  <div class="card" id="savedSection" class="hidden">
    <h2>⏸️ 이어서 풀기</h2>
    <div id="savedInfo" style="margin-bottom:12px"></div>
    <div class="grid">
      <button onclick="resumeQuiz()">이어서 풀기</button>
      <button class="secondary" onclick="clearSaved()">삭제</button>
    </div>
  </div>

  <div class="card">
    <h2>📊 통계</h2>
    <div class="stats">
      <div class="stat"><b id="totalAnimals">0</b>동물</div>
      <div class="stat"><b id="totalCorrect">0</b>정답</div>
      <div class="stat"><b id="accuracy">0</b>%</div>
    </div>
  </div>

  <div class="card">
    <h2>📚 최근 기록</h2>
    <div id="historyList" style="font-size:13px"></div>
  </div>
</section>

<!-- 풀이 화면 -->
<section id="quizSection" class="hidden">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <div class="meta" id="quizProgress"></div>
        <h2 id="animalName" style="margin:5px 0 0"></h2>
      </div>
      <button class="danger" style="width:auto;padding:8px 15px;margin:0" onclick="saveAndExit()">저장하고 나가기</button>
    </div>
    <div class="progress"><div class="bar" id="progressBar"></div></div>

    <div id="questionsContainer"></div>

    <div class="grid">
      <button class="secondary" onclick="prevAnimal()" id="prevBtn">이전</button>
      <button onclick="nextAnimal()" id="nextBtn">다음</button>
    </div>
  </div>
</section>

<!-- 결과 화면 -->
<section id="resultSection" class="hidden">
  <div class="card">
    <h1>시험 결과</h1>
    <div class="stats">
      <div class="stat"><b id="resultScore">0</b>점</div>
      <div class="stat"><b id="resultCorrect">0</b>정답</div>
      <div class="stat"><b id="resultTotal">0</b>문제</div>
    </div>
    <button onclick="reviewWrong()" id="reviewBtn" class="hidden" style="background:#e67e22">❌ 틀린 동물만 다시</button>
    <button class="secondary" onclick="goHome()">처음으로</button>
  </div>

  <div class="card">
    <h2>결과 상세</h2>
    <div id="resultDetails"></div>
  </div>
</section>

</main>

<script>
let DATA=[], quiz=[], answers=[], current=0, submitted=false;
const STORAGE_KEY='animalCBT_save';
const HISTORY_KEY='animalCBT_history';
const $=id=>document.getElementById(id);

// 데이터 로드
fetch("species.json").then(r=>r.json()).then(d=>{DATA=d;init();});

function init(){
  loadStats();
  checkSaved();
}

// ===== 풀이 시작 =====
function startQuiz(count){
  quiz=DATA.slice(0, count);
  answers=Array(quiz.length).fill(null);
  current=0;
  submitted=false;
  $('home').classList.add('hidden');
  $('resultSection').classList.add('hidden');
  $('quizSection').classList.remove('hidden');
  showAnimal();
}

// ===== 랜덤 풀이 =====
function randomQuiz(){
  let count=parseInt(prompt('몇 개를 풀이하시겠습니까? (1-'+DATA.length+')', '10'));
  if(!count || count<1 || count>DATA.length){alert('유효한 숫자를 입력해주세요.');return}
  quiz=shuffle(DATA).slice(0,count);
  answers=Array(quiz.length).fill(null);
  current=0;
  submitted=false;
  $('home').classList.add('hidden');
  $('resultSection').classList.add('hidden');
  $('quizSection').classList.remove('hidden');
  showAnimal();
}

// ===== 동물 표시 =====
function showAnimal(){
  let animal=quiz[current];
  
  $('animalName').textContent=animal.name;
  $('quizProgress').textContent=`${current+1} / ${quiz.length}`;
  $('progressBar').style.width=((current+1)/quiz.length*100)+'%';
  
  let html='';
  const categories=[
    {key:'phylum',label:'문(Phylum)'},
    {key:'class',label:'강(Class)'},
    {key:'order',label:'목(Order)'},
    {key:'family',label:'과(Family)'}
  ];
  
  categories.forEach((cat,idx)=>{
    let options=getOptions(cat.key, animal[cat.key]);
    let answered=answers[current]?answers[current][cat.key]:null;
    
    html+=`
    <div class="question-set">
      <div class="q-title">${idx+1}. ${cat.label}은(는) 무엇인가요?</div>
      <div class="q-label">정답: ${animal[cat.key]}</div>
      <div>
        ${options.map((opt,i)=>`
          <div class="option ${answered===opt?'selected':''}" onclick="selectAnswer(${idx},'${cat.key}','${opt}')">
            ${String.fromCharCode(9312+i)}. ${opt}
          </div>
        `).join('')}
      </div>
      ${submitted && answered ? `<div class="answer ${answered===animal[cat.key]?'correct':'wrong'}">
        ${answered===animal[cat.key]?'✓ 정답':'✗ 오답 (정답: '+animal[cat.key]+')'}
      </div>` : ''}
    </div>
    `;
  });
  
  $('questionsContainer').innerHTML=html;
  
  $('prevBtn').disabled=current===0;
  $('nextBtn').textContent=current===quiz.length-1?'제출':'다음';
  
  autoSave();
}

// ===== 보기 생성 =====
function getOptions(category, correct){
  let pool=[...new Set(DATA.map(x=>x[category]).filter(Boolean))].filter(x=>x!==correct);
  let opts=shuffle([correct,...shuffle(pool).slice(0,3)]);
  return shuffle(opts);
}

// ===== 답 선택 =====
function selectAnswer(qIdx, key, value){
  if(submitted)return;
  if(!answers[current])answers[current]={};
  answers[current][key]=value;
  showAnimal();
}

// ===== 네비게이션 =====
function nextAnimal(){
  let current_ans=answers[current];
  if(!current_ans || !current_ans.phylum || !current_ans.class || !current_ans.order || !current_ans.family){
    alert('모든 문제를 풀어주세요.');
    return;
  }
  if(current<quiz.length-1){
    current++;
    showAnimal();
  }else{
    finish();
  }
}

function prevAnimal(){
  if(current>0){
    current--;
    showAnimal();
  }
}

// ===== 제출 =====
function finish(){
  submitted=true;
  let correct=0, results=[];
  
  quiz.forEach((animal,idx)=>{
    let ans=answers[idx];
    let animalCorrect=0;
    if(ans.phylum===animal.phylum)animalCorrect++;
    if(ans.class===animal.class)animalCorrect++;
    if(ans.order===animal.order)animalCorrect++;
    if(ans.family===animal.family)animalCorrect++;
    
    correct+=animalCorrect;
    results.push({animal,ans,animalCorrect});
  });
  
  let totalQuestions=quiz.length*4;
  saveHistory(correct, totalQuestions);
  localStorage.removeItem(STORAGE_KEY);
  
  $('quizSection').classList.add('hidden');
  $('resultSection').classList.remove('hidden');
  
  $('resultScore').textContent=Math.round(correct/totalQuestions*100);
  $('resultCorrect').textContent=correct;
  $('resultTotal').textContent=totalQuestions;
  
  let wrongCount=results.filter(r=>r.animalCorrect<4).length;
  if(wrongCount>0){
    $('reviewBtn').classList.remove('hidden');
  }else{
    $('reviewBtn').classList.add('hidden');
  }
  
  let detailHTML='';
  results.forEach((r,idx)=>{
    let isCorrect=r.animalCorrect===4;
    detailHTML+=`
    <div class="result-item ${isCorrect?'correct':'wrong'}">
      <div class="result-item-title">${idx+1}. ${r.animal.name} ${isCorrect?'✓':'✗'}</div>
      <div class="result-item-detail">
        문: ${r.ans.phylum===r.animal.phylum?'✓':'✗'} ${r.animal.phylum}<br>
        강: ${r.ans.class===r.animal.class?'✓':'✗'} ${r.animal.class}<br>
        목: ${r.ans.order===r.animal.order?'✓':'✗'} ${r.animal.order}<br>
        과: ${r.ans.family===r.animal.family?'✓':'✗'} ${r.animal.family}
      </div>
    </div>
    `;
  });
  $('resultDetails').innerHTML=detailHTML;
}

// ===== 오답 다시 풀기 =====
function reviewWrong(){
  let wrong=[];
  quiz.forEach((animal,idx)=>{
    let ans=answers[idx];
    let animalCorrect=0;
    if(ans.phylum===animal.phylum)animalCorrect++;
    if(ans.class===animal.class)animalCorrect++;
    if(ans.order===animal.order)animalCorrect++;
    if(ans.family===animal.family)animalCorrect++;
    if(animalCorrect<4)wrong.push(animal);
  });
  
  quiz=wrong;
  answers=Array(quiz.length).fill(null);
  current=0;
  submitted=false;
  $('resultSection').classList.add('hidden');
  $('quizSection').classList.remove('hidden');
  showAnimal();
}

// ===== 저장 기능 =====
function autoSave(){
  let save={quiz,answers,current,date:new Date().toLocaleString('ko-KR')};
  localStorage.setItem(STORAGE_KEY,JSON.stringify(save));
}

function checkSaved(){
  let saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
  if(saved && saved.quiz.length>0){
    $('savedSection').classList.remove('hidden');
    $('savedInfo').innerHTML=`<b>${saved.current+1}/${saved.quiz.length}</b> 진행 중 <span class="meta">${saved.date}</span>`;
  }
}

function resumeQuiz(){
  let saved=JSON.parse(localStorage.getItem(STORAGE_KEY));
  if(!saved){alert('저장된 풀이가 없습니다.');return}
  quiz=saved.quiz;
  answers=saved.answers;
  current=saved.current;
  submitted=false;
  $('home').classList.add('hidden');
  $('resultSection').classList.add('hidden');
  $('quizSection').classList.remove('hidden');
  showAnimal();
}

function saveAndExit(){
  if(confirm('저장하고 나가시겠습니까?')){
    autoSave();
    alert('저장되었습니다!');
    goHome();
  }
}

function clearSaved(){
  if(confirm('저장된 풀이를 삭제하시겠습니까?')){
    localStorage.removeItem(STORAGE_KEY);
    $('savedSection').classList.add('hidden');
    alert('삭제되었습니다.');
  }
}

// ===== 통계 =====
function saveHistory(correct,total){
  let history=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');
  history.push({correct,total,date:new Date().toLocaleDateString('ko-KR')});
  localStorage.setItem(HISTORY_KEY,JSON.stringify(history));
}

function loadStats(){
  let history=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');
  if(history.length===0){
    $('totalAnimals').textContent='0';
    $('totalCorrect').textContent='0';
    $('accuracy').textContent='0';
    $('historyList').innerHTML='<p style="color:#999">아직 기록이 없습니다.</p>';
    return;
  }
  
  let totalCorrect=0, totalQuestions=0;
  history.forEach(h=>{totalCorrect+=h.correct;totalQuestions+=h.total});
  
  $('totalAnimals').textContent=Math.round(totalQuestions/4);
  $('totalCorrect').textContent=totalCorrect;
  $('accuracy').textContent=totalQuestions>0?Math.round(totalCorrect/totalQuestions*100):'0';
  
  let historyHTML='';
  history.slice(-10).reverse().forEach(h=>{
    historyHTML+=`<div style="padding:8px;border-bottom:1px solid #eee"><b>${h.correct}/${h.total}</b> (${Math.round(h.correct/h.total*100)}%) - ${h.date}</div>`;
  });
  $('historyList').innerHTML=historyHTML;
}

// ===== 홈으로 =====
function goHome(){
  $('quizSection').classList.add('hidden');
  $('resultSection').classList.add('hidden');
  $('home').classList.remove('hidden');
  loadStats();
  checkSaved();
}

// ===== 유틸 =====
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
</script>
</body></html>
